name: CI

on:
  push:
    paths:
      - "src/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "src/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Verify Winget
        run: winget --version

      - name: Install Google Chrome
        shell: pwsh
        run: |
          winget install --id Google.Chrome -e --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
          $wingetCode = $LASTEXITCODE
          $chrome = Join-Path $env:ProgramFiles "Google\Chrome\Application\chrome.exe"
          if (-not (Test-Path $chrome)) {
            throw "Google Chrome is missing after winget install (exit $wingetCode)"
          }
          Write-Host "winget exit code: $wingetCode"
          Write-Host "Chrome version: $((Get-Item $chrome).VersionInfo.ProductVersion)"
          exit 0

      - name: Install Playwright
        run: python -m pip install --upgrade pip playwright

      - name: Smoke tests (unit + real Chrome)
        env:
          FPBROWSER_E2E: "1"
        run: python src/smoke_test.py -v
